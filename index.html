```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
        }

        /* Barra de navegación */
        .navbar {
            background: #222;
            padding: 15px 0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background: #555;
        }

        .navbar a.active {
            background: #007bff;
        }

        /* Contenido principal */
        .contenido {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            text-align: center;
        }

        .contenido h1 {
            color: #222;
            margin-bottom: 10px;
        }

        .contenido p {
            color: #666;
            margin-bottom: 30px;
        }

        /* Video */
        .video-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 650px;
            margin: auto;
        }

        iframe {
            width: 100%;
            height: 350px;
            border-radius: 8px;
        }

        /* Pie de página */
        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Diseño para celulares */
        @media (max-width: 600px) {
            .navbar ul {
                flex-direction: column;
                align-items: center;
            }

            .navbar a {
                display: block;
                width: 200px;
                text-align: center;
            }

            iframe {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar">
        <div class="container">
            <ul>
                <li>
                    <a class="active" href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="columnas.html">Columnas</a>
                </li>

                <li>
                    <a href="tarjetas.html">Tarjetas</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido -->
    <main class="contenido">

        <h1>Bienvenido a mi página web</h1>

        <p>
            En esta página podemos encontrar diferentes ejemplos
            de diseño y contenido utilizando HTML y CSS.
        </p>

        <!-- Video -->
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/6C_s56iscpQ?si=b0hltwtcRGwSWBek"
                title="Video de YouTube"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>© 2026 - Mi Página Web | Proyecto HTML</p>
    </footer>

</body>
</html>
