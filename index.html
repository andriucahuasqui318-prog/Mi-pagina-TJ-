```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Página Web</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f3ef;
            color: #222;
        }

        /* BARRA DE NAVEGACIÓN */
        .navbar {
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            padding: 18px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            padding: 12px 22px;
            border-radius: 25px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background: #c9a227;
            color: #111;
        }

        .navbar a.active {
            background: #c9a227;
            color: #111;
            font-weight: bold;
        }

        /* CONTENIDO PRINCIPAL */
        .contenido {
            width: 90%;
            max-width: 1000px;
            margin: 60px auto;
            text-align: center;
        }

        .contenido h1 {
            font-size: 38px;
            color: #162c3a;
            margin-bottom: 15px;
        }

        .contenido h1 span {
            color: #b08d1a;
        }

        .contenido p {
            font-size: 17px;
            color: #666;
            max-width: 650px;
            margin: 0 auto 35px;
            line-height: 1.6;
        }

        /* TARJETA DEL VIDEO */
        .video-container {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 15px;
            border-radius: 18px;
            border-top: 5px solid #c9a227;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        iframe {
            width: 100%;
            height: 380px;
            border-radius: 12px;
        }

        /* BOTÓN */
        .boton {
            display: inline-block;
            margin-top: 30px;
            padding: 13px 28px;
            background: #162c3a;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
        }

        .boton:hover {
            background: #c9a227;
            color: #111;
        }

        /* PIE DE PÁGINA */
        footer {
            margin-top: 70px;
            background: #0f2027;
            color: white;
            text-align: center;
            padding: 25px;
        }

        footer span {
            color: #c9a227;
        }

        /* CELULARES */
        @media (max-width: 600px) {

            .navbar ul {
                flex-direction: column;
                gap: 8px;
            }

            .navbar a {
                display: block;
                width: 200px;
                text-align: center;
            }

            .contenido h1 {
                font-size: 28px;
            }

            iframe {
                height: 220px;
            }
        }

    </style>
</head>

<body>

    <!-- MENÚ -->
    <nav class="navbar">
        <div class="container">
            <ul>

                <li>
                    <a class="active" href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="columnas.html">Columnas</a>
                </li>

                <li>
                    <a href="tarjetas.html">Tarjetas</a>
                </li>

            </ul>
        </div>
    </nav>


    <!-- CONTENIDO -->
    <main class="contenido">

        <h1>Bienvenido a <span>Mi Página Web</span></h1>

        <p>
            Explora nuestro contenido y conoce los diferentes
            ejemplos de diseño realizados utilizando HTML y CSS.
        </p>


        <!-- VIDEO -->
        <div class="video-container">

            <iframe 
                src="https://www.youtube.com/embed/6C_s56iscpQ?si=b0hltwtcRGwSWBek"
                title="Video de YouTube"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>

        </div>


        <a href="columnas.html" class="boton">
            Ver contenido
        </a>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>
        <p>
            © 2026 - <span>Mi Página Web</span> | Proyecto HTML
        </p>
    </footer>

</body>
</html>
```
